# Producción: frontend compilado (nginx) + backend
# Uso: docker compose up --build

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: proyecto2-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: proyecto2-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
